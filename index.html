<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Roltes System</title>
  <style>
    /* ── RESET & VARIABLES ─────────────────────────────── */
    :root {
      --primary:   #1e3a5f;
      --primary-d: #162d49;
      --accent:    #2563eb;
      --bg:        #f1f5f9;
      --card:      #ffffff;
      --text:      #0f172a;
      --muted:     #64748b;
      --border:    #e2e8f0;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,.08);
      --shadow-md: 0 4px 14px rgba(0,0,0,.11);
      --hdr:       54px;
      /* status */
      --nowe:    #ef4444;
      --prod:    #1e293b;
      --oczek:   #f97316;
      --gotowe:  #22c55e;
      --zreal:   #94a3b8;
      --wazny:   #2563eb;
    }
    *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    button, select, input, textarea {
      font-family: inherit; font-size: inherit;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .hdr {
      position: fixed; top:0; left:0; right:0;
      height: var(--hdr); background: var(--primary);
      color: #fff; display: flex; align-items: center;
      gap: 4px; padding: 0 8px; z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .hdr-back {
      width:40px; height:40px; border:none; background:none;
      color:#fff; font-size:1.4rem; cursor:pointer;
      display:none; align-items:center; justify-content:center;
      border-radius:8px; flex-shrink:0;
    }
    .hdr-back.vis { display:flex; }
    .hdr-title {
      flex:1; font-size:1rem; font-weight:700;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .hdr-title small { font-weight:400; font-size:.82rem; opacity:.65; }
    .hdr-btn {
      width:40px; height:40px; border:none; background:none;
      color:rgba(255,255,255,.85); font-size:1.1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      border-radius:8px; transition:background .15s; flex-shrink:0;
    }
    .hdr-btn:hover { background:rgba(255,255,255,.15); }

    /* ── MAIN ───────────────────────────────────────────── */
    #main {
      padding-top: calc(var(--hdr) + 12px);
      padding-bottom: 24px; min-height:100vh;
    }
    #main.no-hdr { padding-top: 0; }
    .page { padding: 0 12px; }

    /* ── LOGIN ──────────────────────────────────────────── */
    .login-wrap {
      position:fixed; inset:0;
      background: linear-gradient(145deg, #1e3a5f 0%, #1e40af 100%);
      display:flex; align-items:center; justify-content:center;
      z-index:200;
    }
    .login-box {
      background:#fff; border-radius:18px;
      padding:36px 28px 32px;
      width:calc(100% - 40px); max-width:340px;
      box-shadow: 0 24px 60px rgba(0,0,0,.3);
      text-align:center;
    }
    .login-logo {
      font-size:2.2rem; font-weight:900;
      letter-spacing:.08em; color:var(--primary);
      margin-bottom:2px;
    }
    .login-sub { color:var(--muted); font-size:.8rem; margin-bottom:28px; }
    .login-box input {
      width:100%; padding:13px 16px;
      border:1.5px solid var(--border); border-radius:10px;
      font-size:.97rem; margin-bottom:10px; outline:none;
      transition:border-color .2s;
    }
    .login-box input:focus { border-color:var(--accent); }
    .login-box input.err { border-color:var(--nowe); }
    .btn-login {
      width:100%; padding:13px;
      background:var(--primary); color:#fff;
      border:none; border-radius:10px;
      font-size:.97rem; font-weight:700; cursor:pointer;
      transition:background .2s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-login:hover { background:var(--primary-d); }
    .login-err { color:var(--nowe); font-size:.8rem; margin-top:10px; min-height:18px; }

    /* ── DASHBOARD TILES ─────────────────────────────────── */
    .tile-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:12px;
      padding:0 12px;
    }
    @media(min-width:600px){ .tile-grid { grid-template-columns:repeat(3,1fr); } }
    .tile {
      background:var(--card); border-radius:14px;
      padding:20px 16px; box-shadow:var(--shadow);
      cursor:pointer; transition:box-shadow .15s, transform .1s;
      display:flex; flex-direction:column; gap:10px;
      border:1px solid var(--border);
    }
    .tile:active { transform:scale(.97); }
    .tile:hover  { box-shadow:var(--shadow-md); }
    .tile-icon {
      width:46px; height:46px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.5rem;
    }
    .tile-name { font-weight:700; font-size:.95rem; }
    .tile-desc { font-size:.78rem; color:var(--muted); line-height:1.4; }
    .tile-count {
      font-size:1.4rem; font-weight:800; color:var(--accent);
    }
    .ic-purple { background:#ede9fe; }
    .ic-blue   { background:#dbeafe; }
    .ic-orange { background:#ffedd5; }
    .ic-teal   { background:#ccfbf1; }

    /* ── ORDER LIST ─────────────────────────────────────── */
    .list-toolbar {
      display:flex; gap:8px; align-items:center;
      padding:0 12px; margin-bottom:10px;
    }
    .btn-new {
      background:var(--accent); color:#fff;
      border:none; border-radius:20px;
      padding:8px 16px; font-size:.85rem; font-weight:700;
      cursor:pointer; white-space:nowrap;
      transition:background .15s;
    }
    .btn-new:hover { background:#1d4ed8; }
    .btn-filter {
      background:var(--card); color:var(--muted);
      border:1.5px solid var(--border); border-radius:20px;
      padding:7px 14px; font-size:.83rem; font-weight:600;
      cursor:pointer; display:flex; align-items:center; gap:5px;
      transition:border-color .15s;
    }
    .btn-filter.active { border-color:var(--accent); color:var(--accent); }
    .filter-badge {
      background:var(--accent); color:#fff;
      border-radius:50%; width:18px; height:18px;
      font-size:.68rem; font-weight:800;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .filter-panel {
      background:var(--card); border-radius:var(--radius);
      margin:0 12px 10px; padding:10px 12px;
      box-shadow:var(--shadow); border:1px solid var(--border);
    }
    .filter-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .filter-row:last-child { margin-bottom:0; }
    .filter-chip {
      padding:5px 12px; border-radius:16px;
      border:1.5px solid var(--border); background:var(--bg);
      color:var(--muted); font-size:.78rem; font-weight:600;
      cursor:pointer; transition:all .15s; white-space:nowrap;
    }
    .filter-chip.on {
      border-color:var(--accent); background:var(--accent); color:#fff;
    }
    .filter-select {
      padding:7px 10px; border-radius:8px;
      border:1.5px solid var(--border); background:var(--bg);
      color:var(--text); font-size:.82rem; outline:none; cursor:pointer;
    }
    .filter-input {
      flex:1; padding:7px 10px; border-radius:8px;
      border:1.5px solid var(--border); background:var(--bg);
      color:var(--text); font-size:.82rem; outline:none; min-width:120px;
    }
    .filter-input:focus, .filter-select:focus { border-color:var(--accent); }

    .order-list { display:flex; flex-direction:column; gap:6px; padding:0 12px; }

    .order-card {
      border-radius:var(--radius);
      border:1.5px solid transparent;
      background:var(--card);
      padding:8px 11px;
      box-shadow:var(--shadow);
      cursor:pointer;
      transition:box-shadow .15s;
    }
    .order-card:active { opacity:.87; }
    .order-card-top {
      display:flex; align-items:center; gap:6px; margin-bottom:3px;
      flex-wrap:wrap;
    }
    .order-num { font-weight:800; font-size:.9rem; }
    .order-card-mid { margin-bottom:2px; }
    .order-client { font-size:.83rem; font-weight:600; }
    .order-product { font-size:.73rem; color:var(--muted); }
    .order-card-bot {
      display:flex; justify-content:space-between; align-items:center;
      font-size:.7rem; color:var(--muted);
    }

    /* ── BADGES ─────────────────────────────────────────── */
    .badge {
      display:inline-flex; align-items:center;
      padding:3px 8px; border-radius:6px;
      font-size:.7rem; font-weight:700;
      color:#fff; white-space:nowrap;
    }
    .badge-wazny { background:#2563eb; }
    .badge-role-administrator { background:#7c3aed; }
    .badge-role-kierownik     { background:#1e3a5f; }
    .badge-role-produkcja     { background:#0284c7; }
    .badge-role-biuro         { background:#059669; }
    .badge-role-readonly      { background:#94a3b8; }
    .badge-inactive           { background:#ef4444; }

    /* ── ORDER DETAIL ───────────────────────────────────── */
    .det-section {
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); margin-bottom:10px;
      overflow:hidden;
    }
    .det-section-title {
      font-size:.72rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.06em; color:var(--muted);
      padding:12px 16px 0;
    }
    .det-field {
      padding:10px 16px; border-bottom:1px solid var(--border);
    }
    .det-field:last-child { border-bottom:none; }
    .det-field label {
      display:block; font-size:.71rem; font-weight:700;
      text-transform:uppercase; letter-spacing:.05em;
      color:var(--muted); margin-bottom:4px;
    }
    .det-field input,
    .det-field select,
    .det-field textarea {
      width:100%; border:none; outline:none;
      font-size:.95rem; color:var(--text);
      background:transparent; padding:0;
      resize:vertical;
    }
    .det-field textarea { min-height:72px; }
    .det-field input[readonly],
    .det-field select[disabled],
    .det-field textarea[readonly] {
      color:var(--muted);
    }
    .det-field .field-val { font-size:.95rem; }

    /* status buttons row */
    .status-row { display:flex; gap:6px; flex-wrap:wrap; }
    .status-btn {
      flex:1; min-width:0; padding:9px 4px;
      border-radius:8px; border:2px solid var(--border);
      background:var(--card); cursor:pointer;
      font-size:.72rem; font-weight:700; text-align:center;
      transition:all .15s; color:var(--muted); white-space:nowrap;
    }
    .status-btn.active { color:#fff; border-color:transparent; }

    /* photos */
    .photo-grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
      padding:12px 16px;
    }
    .photo-thumb {
      aspect-ratio:1; border-radius:8px;
      overflow:hidden; background:var(--border); position:relative;
    }
    .photo-thumb img { width:100%; height:100%; object-fit:cover; cursor:pointer; }
    .photo-del {
      position:absolute; top:3px; right:3px;
      background:rgba(0,0,0,.6); color:#fff;
      border:none; border-radius:50%; width:22px; height:22px;
      font-size:.65rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .photo-add {
      aspect-ratio:1; border-radius:8px;
      border:2px dashed var(--border); background:var(--bg);
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; cursor:pointer;
      color:var(--muted); font-size:.72rem;
    }
    .photo-add-icon { font-size:1.3rem; }
    .file-input-hidden { display:none; }

    /* log */
    .log-list { padding:0 16px 12px; }
    .log-item {
      padding:7px 0; border-bottom:1px solid var(--border);
      font-size:.78rem; color:var(--muted);
    }
    .log-item:last-child { border-bottom:none; }
    .log-who { font-weight:700; color:var(--text); }
    .log-time { font-size:.7rem; opacity:.7; }

    /* ── MATERIALS VIEW ─────────────────────────────────── */
    .mat-group {
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); margin-bottom:10px;
      border-left:4px solid var(--oczek);
      cursor:pointer; transition:box-shadow .15s;
    }
    .mat-group:active { opacity:.87; }
    .mat-head {
      padding:12px 14px 8px;
      display:flex; align-items:center; gap:8px;
    }
    .mat-order-num { font-weight:800; font-size:.97rem; }
    .mat-client { font-size:.82rem; color:var(--muted); }
    .mat-body {
      padding:0 14px 12px;
      font-size:.88rem; color:var(--text);
      white-space:pre-wrap; line-height:1.5;
    }

    /* ── ADMIN PANEL ─────────────────────────────────────── */
    .admin-tabs {
      display:flex; gap:0; margin-bottom:14px;
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden;
    }
    .admin-tab {
      flex:1; padding:12px 8px; border:none;
      background:none; cursor:pointer; font-size:.82rem;
      font-weight:600; color:var(--muted);
      border-bottom:2.5px solid transparent;
      transition:all .15s;
    }
    .admin-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

    .user-card {
      background:var(--card); border-radius:var(--radius);
      padding:13px 14px; box-shadow:var(--shadow);
      display:flex; align-items:center; gap:10px;
      margin-bottom:8px;
    }
    .user-avatar {
      width:38px; height:38px; border-radius:50%;
      background:var(--primary); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:.88rem; flex-shrink:0;
    }
    .user-info { flex:1; min-width:0; }
    .user-name  { font-weight:700; font-size:.93rem; }
    .user-uname { font-size:.75rem; color:var(--muted); }

    .drive-card {
      background:var(--card); border-radius:var(--radius);
      padding:16px; box-shadow:var(--shadow); margin-bottom:10px;
    }
    .drive-label { font-size:.82rem; color:var(--muted); margin-bottom:8px; }
    .drive-bar-wrap { background:var(--border); border-radius:4px; height:8px; overflow:hidden; }
    .drive-bar { height:100%; border-radius:4px; background:var(--accent); transition:width .5s; }
    .drive-bar.warn   { background:var(--oczek); }
    .drive-bar.danger { background:var(--nowe); }

    .config-list { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .config-item {
      padding:12px 14px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:8px;
    }
    .config-item:last-child { border-bottom:none; }
    .config-item-label { flex:1; font-size:.93rem; }
    .btn-cfg-del {
      background:none; border:none; color:var(--nowe);
      cursor:pointer; font-size:.85rem; padding:4px 8px;
    }

    .role-desc-card {
      background:var(--card); border-radius:var(--radius);
      padding:12px 14px; box-shadow:var(--shadow);
      margin-bottom:8px;
      border-left:3px solid var(--accent);
    }
    .role-desc-name { font-weight:700; font-size:.92rem; margin-bottom:3px; }
    .role-desc-text { font-size:.78rem; color:var(--muted); line-height:1.5; }

    /* ── MODAL (bottom sheet) ────────────────────────────── */
    .modal-bg {
      position:fixed; inset:0; background:rgba(0,0,0,.45);
      z-index:100; display:flex; align-items:flex-end;
      opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .modal-bg.open { opacity:1; pointer-events:all; }
    .modal-sheet {
      width:100%; background:var(--card);
      border-radius:18px 18px 0 0;
      padding:16px 16px 40px;
      transform:translateY(100%);
      transition:transform .25s ease;
      max-height:92vh; overflow-y:auto;
    }
    .modal-bg.open .modal-sheet { transform:translateY(0); }
    .modal-handle {
      width:40px; height:4px; border-radius:2px;
      background:var(--border); margin:0 auto 14px;
    }
    .modal-title { font-size:1.05rem; font-weight:700; margin-bottom:14px; }
    .modal-field { margin-bottom:12px; }
    .modal-field label {
      display:block; font-size:.72rem; font-weight:700;
      text-transform:uppercase; letter-spacing:.05em;
      color:var(--muted); margin-bottom:5px;
    }
    .modal-field input,
    .modal-field select,
    .modal-field textarea {
      width:100%; padding:11px 14px;
      border:1.5px solid var(--border); border-radius:8px;
      font-size:.95rem; outline:none;
      background:var(--bg); transition:border-color .2s;
    }
    .modal-field input:focus,
    .modal-field select:focus,
    .modal-field textarea:focus { border-color:var(--accent); background:#fff; }
    .modal-field textarea { min-height:72px; resize:vertical; }
    .modal-btns { display:flex; gap:8px; margin-top:14px; }
    .modal-btns button { flex:1; }
    .modal-err {
      color:var(--nowe); font-size:.78rem; margin-top:6px;
      text-align:center; min-height:16px;
    }

    /* ── BUTTONS ────────────────────────────────────────── */
    .btn {
      padding:12px 20px; border-radius:8px; border:none;
      font-size:.9rem; font-weight:700; cursor:pointer;
      transition:opacity .15s, transform .1s;
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
    }
    .btn:active { transform:scale(.97); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-primary { background:var(--accent); color:#fff; width:100%; }
    .btn-danger  { background:var(--nowe);   color:#fff; width:100%; }
    .btn-ghost   { background:var(--bg); color:var(--muted); border:1.5px solid var(--border); width:100%; }
    .btn-sm      { padding:8px 14px; font-size:.8rem; }
    .btn-icon    { width:36px; height:36px; padding:0; border-radius:8px; }

    /* ── UTILS ──────────────────────────────────────────── */
    .section-label {
      font-size:.72rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.06em; color:var(--muted);
      margin:14px 0 6px; padding:0 12px;
    }
    .empty-state {
      text-align:center; padding:52px 24px; color:var(--muted);
    }
    .empty-icon { font-size:3rem; margin-bottom:10px; }
    .empty-text { font-size:.88rem; }

    .toast {
      position:fixed; bottom:80px; left:50%;
      transform:translateX(-50%) translateY(16px);
      background:#0f172a; color:#fff;
      padding:9px 18px; border-radius:20px;
      font-size:.82rem; opacity:0; transition:all .22s;
      z-index:300; white-space:nowrap; pointer-events:none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner {
      width:18px; height:18px;
      border:2.5px solid rgba(255,255,255,.3);
      border-top-color:#fff; border-radius:50%;
      animation:spin .55s linear infinite;
      display:inline-block;
    }
    .loading-cover {
      position:fixed; inset:0;
      background:rgba(255,255,255,.65);
      display:flex; align-items:center; justify-content:center;
      z-index:150;
    }
    .loading-cover .ring {
      width:40px; height:40px;
      border:3px solid var(--border);
      border-top-color:var(--accent);
      border-radius:50%; animation:spin .7s linear infinite;
    }
    .hidden { display:none!important; }
    .mt8  { margin-top:8px; }
    .mt12 { margin-top:12px; }
    .divider { height:1px; background:var(--border); margin:10px 0; }

    /* image fullscreen */
    .img-fs {
      position:fixed; inset:0; background:#000;
      z-index:250; display:flex; align-items:center;
      justify-content:center; cursor:pointer;
      overflow:hidden; touch-action:none;
    }
    .img-fs.hidden { display:none; }
    .img-fs img {
      max-width:100%; max-height:100%; object-fit:contain;
      touch-action:none; user-select:none; -webkit-user-select:none;
      -webkit-touch-callout:none;
      transform-origin:center center;
      transition:transform .2s ease;
      will-change:transform;
    }
    .img-fs img.zooming { transition:none; }
    .img-fs.zoomed { cursor:grab; }
    .img-fs.zoomed.dragging { cursor:grabbing; }
    .img-fs-close {
      position:absolute; top:14px; right:14px;
      background:rgba(255,255,255,.2); border:none; color:#fff;
      width:36px; height:36px; border-radius:50%;
      font-size:1.1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }

    /* confirm dialog */
    .confirm-modal {
      position:fixed; inset:0; background:rgba(0,0,0,.5);
      z-index:200; display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .confirm-modal.open { opacity:1; pointer-events:all; }
    .confirm-box {
      background:var(--card); border-radius:16px;
      padding:24px 20px; width:calc(100%-40px); max-width:320px;
      box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center;
    }
    .confirm-title { font-weight:700; font-size:1rem; margin-bottom:8px; }
    .confirm-text  { font-size:.85rem; color:var(--muted); margin-bottom:18px; }
    .confirm-btns  { display:flex; gap:8px; }
    .confirm-btns button { flex:1; }
  </style>
</head>
<body>

<!-- Loading -->
<div class="loading-cover" id="loading"><div class="ring"></div></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Image fullscreen -->
<div class="img-fs hidden" id="img-fs">
  <button class="img-fs-close" onclick="closeImg()">✕</button>
  <img id="img-full" src="" alt="">

// ── Firebase data helpers ─────────────────────────────────
async function loadAllData() {
  showLoad();
  try {
    const [ordSnap, wysSnap, usrSnap, cfgSnap] = await Promise.all([
      db.collection('orders').orderBy('createdAt', 'desc').get(),
      db.collection('wysylki').orderBy('createdAt', 'desc').get(),
      db.collection('users').get(),
      db.collection('config').doc('default').get(),
    ]);
    cache.orders  = ordSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    cache.wysylki = wysSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    cache.users   = usrSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    cache.cfg     = cfgSnap.exists ? cfgSnap.data() : { ...DEFAULT_CONFIG };
  } finally {
    hideLoad();
  }
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
async function doLogin() {
  const un  = g('l-user').value.trim().toLowerCase();
  const pw  = g('l-pass').value;
  const btn = g('l-btn');
  g('l-err').textContent = '';
  if (!un || !pw) { g('l-err').textContent = 'Podaj login i hasło.'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    await auth.signInWithEmailAndPassword(un + '@roltes.app', pw);
    // onAuthStateChanged handles the rest
  } catch(e) {
    g('l-err').textContent = 'Błędny login lub hasło.';
    g('l-user').classList.add('err');
    btn.disabled = false;
    btn.textContent = 'Zaloguj';
  }
}

// ── Presence (online status) ──────────────────────────────
let _heartbeat = null;
let _usersUnsub = null;

function presenceSet(online) {
  const uid = cache.me?.uid;
  if (!uid) return;
  db.collection('users').doc(uid).update({ online, lastSeen: new Date().toISOString() }).catch(()=>{});
}

function startUsersListener() {
  if (_usersUnsub) return;
  _usersUnsub = db.collection('users').onSnapshot(snap => {
    cache.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.screen === 'admin' && (!state.params?.tab || state.params?.tab === 'users')) {
      const ac = g('admin-content');
      if (ac) renderAdminUsers(ac);
    }
  }, () => {});
}

function stopUsersListener() {
  if (_usersUnsub) { _usersUnsub(); _usersUnsub = null; }
}

function presenceStart() {
  presenceSet(true);
  _heartbeat = setInterval(() => presenceSet(true), 60_000);
  startUsersListener();
  window.addEventListener('beforeunload', presenceStop);
}

function presenceStop() {
  clearInterval(_heartbeat);
  _heartbeat = null;
  stopUsersListener();
  presenceSet(false);
}

async function doLogout() {
  presenceStop();
  try { await auth.signOut(); } catch(e) {}
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
let state = { screen:'login', params:{} };
let prevScreen = null;

function navigate(screen, params={}) {
  prevScreen = state.screen !== screen ? state : prevScreen;
  state = { screen, params };
  render();
}

function goBack() {
  if (state.screen === 'order') navigate('orders');
  else if (state.screen === 'wysylka') navigate('wysylki');
  else navigate('dashboard');
}

function render() {
  const main = g('main');
  const hdr  = g('hdr');
  const isLogin = state.screen === 'login';

  hdr.classList.toggle('hidden', isLogin);
  main.classList.toggle('no-hdr', isLogin);

  const isRoot = ['dashboard','login'].includes(state.screen);
  g('hdr-back').classList.toggle('vis', !isRoot);

  const admin = cache.me?.role === 'administrator';
  g('hdr-admin').style.display = (admin && state.screen !== 'admin') ? '' : 'none';

  switch(state.screen) {
    case 'login':     renderLogin(main);                        break;
    case 'dashboard': renderDashboard(main);                    break;
    case 'orders':    renderOrders(main);                       break;
    case 'order':     renderOrderDetail(main, state.params.id); break;
    case 'wysylki':   renderWysylki(main);                      break;
    case 'wysylka':   renderWysylkaDetail(main, state.params.id); break;
    case 'materials': goToMaterials();                          break;
    case 'admin':     renderAdmin(main, state.params.tab||'users'); break;
    default: navigate('dashboard');
  }
}

function showApp() {
  if (!cache.me) { navigate('login'); return; }
  navigate('dashboard');
}

function renderRecentLog() {
  const all = cache.orders

              onchange="filters.trasa=this.value;renderOrderList()">
        <option value="">Wszystkie trasy</option>

              onchange="filters.sort=this.value;renderOrders(g('main'))">
        <option value="date_desc" ${filters.sort==='date_desc'?'selected':''}>Najnowsze</option>
        <option value="date_asc"  ${filters.sort==='date_asc' ?'selected':''}>Najstarsze</option>
        <option value="plan_asc"  ${filters.sort==='plan_asc' ?'selected':''}>Planowana data ↑</option>
        <option value="status"    ${filters.sort==='status'   ?'selected':''}>Wg statusu</option>
      </select>
    </div>

      <div class="filter-row">
        ${Object.entries(STATUS).map(([k,v])=>`
          <div class="filter-chip${filters.status.includes(k)?' on':''}"
               onclick="toggleStatusFilter('${k}')">${v.label}</div>`).join('')}
      </div>
      <div class="filter-row" style="margin-top:8px">
        <input class="filter-input" type="text" placeholder="Nr zamówienia..."
               value="${esc(filters.numer)}" oninput="filters.numer=this.value;renderOrderList()">
        <input class="filter-input" type="text" placeholder="Szukaj zamawiającego..."
               value="${esc(filters.zamawiajacy)}" oninput="filters.zamawiajacy=this.value;renderOrderList()">
        <select class="filter-select" onchange="filters.produkt=this.value;renderOrderList()">
          <option value="">Wszystkie produkty</option>
          ${cfg.produkty.map(p=>`<option value="${esc(p)}" ${filters.produkt===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="filters.kolor=this.value;renderOrderList()">
          <option value="">Wszystkie kolory</option>
          ${cfg.kolory.map(k=>`<option value="${esc(k)}" ${filters.kolor===k?'selected':''}>${esc(k)}</option>`).join('')}
        </select>
        <div class="filter-chip${filters.priorytet==='wazny'?' on':''}"
             onclick="filters.priorytet=filters.priorytet==='wazny'?'':'wazny';renderOrderList()">⚑ Ważne</div>
        <div class="filter-chip" onclick="clearFilters()" style="color:var(--nowe)">✕ Wyczyść</div>
      </div>
    </div>

    <div id="order-list-wrap" class="order-list"></div>`;

  renderOrderList();
}

function renderOrderList() {
  const wrap = g('order-list-wrap');
  if (!wrap) return;
  let orders = cache.orders.slice();

  if (filters.status.length)       orders = orders.filter(o => filters.status.includes(o.statusRealizacji));
  if (filters.numer)               orders = orders.filter(o => o.numerZamowienia?.toLowerCase().includes(filters.numer.toLowerCase()));
  if (filters.zamawiajacy)         orders = orders.filter(o => o.zamawiajacy?.toLowerCase().includes(filters.zamawiajacy.toLowerCase()));
  if (filters.produkt)             orders = orders.filter(o => o.rodzajProduktu === filters.produkt);
  if (filters.kolor)               orders = orders.filter(o => o.kolorMaterialu === filters.kolor);
  if (filters.priorytet==='wazny') orders = orders.filter(o => o.priorytet === 'wazny');
  if (filters.trasa)               orders = orders.filter(o => o.numerTrasy === filters.trasa);

  const sortFns = {
    date_desc: (a,b) => new Date(b.createdAt)-new Date(a.createdAt),
    date_asc:  (a,b) => new Date(a.createdAt)-new Date(b.createdAt),
    plan_asc:  (a,b) => (a.planowanaData||'9').localeCompare(b.planowanaData||'9'),
    status:    (a,b) => Object.keys(STATUS).indexOf(a.statusRealizacji)-Object.keys(STATUS).indexOf(b.statusRealizacji),
  };
  orders.sort(sortFns[filters.sort] || sortFns.date_desc);

  if (!orders.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p class="empty-text">Brak zamówień spełniających kryteria</p></div>`;
    return;
  }

  wrap.innerHTML = orders.map(o => {
    const sc      = STATUS[o.statusRealizacji] ?? STATUS.nowe;
    const wazny   = o.priorytet === 'wazny';
    const isZreal = o.statusRealizacji === 'zrealizowane';
    const isProd  = o.statusRealizacji === 'w_produkcji';
    const bg      = wazny ? '#dbeafe' : sc.bg;
    const bord    = wazny ? '#93c5fd' : sc.border;
    const grey    = isZreal ? 'color:#c0cdd8' : '';
    const cardFW  = isProd  ? 'font-weight:700' : '';
    return `<div class="order-card" onclick="navigate('order',{id:'${o.id}'})"
                 style="background:${bg};border-color:${bord};${cardFW}">
      <div class="order-card-top">
        <span class="order-num" style="${grey}">${esc(o.numerZamowienia)}</span>
        ${wazny ? `<span class="badge badge-wazny">⚑ Ważny</span>` : ''}
        <span class="badge" style="background:${sc.color};margin-left:auto">${sc.label}</span>
      </div>
      <div class="order-card-mid">
        <div class="order-client" style="${grey}">${esc(o.zamawiajacy)}</div>
        <div class="order-product" style="${grey}">${esc(o.rodzajProduktu)}${o.kolorMaterialu?' · '+esc(o.kolorMaterialu):''}</div>
      </div>
      <div class="order-card-bot" style="${grey}">
        <span>${o.planowanaData?'📅 '+fmtDate(o.planowanaData):'Bez terminu'}</span>
        ${o.numerTrasy?`<span>Trasa: ${esc(o.numerTrasy)}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function toggleStatusFilter(s) {
  const i = filters.status.indexOf(s);
  if (i===-1) filters.status.push(s); else filters.status.splice(i,1);
  renderOrders(g('main'));
}

function clearFilters() {
  filters = { status:[], numer:'', zamawiajacy:'', produkt:'', kolor:'', priorytet:'', trasa:'', sort:filters.sort };
  renderOrders(g('main'));
}

function goToMaterials() {
  filters = { status:['oczekiwanie_na_materialy'], numer:'', zamawiajacy:'', produkt:'', kolor:'', priorytet:'', trasa:'', sort:filters.sort };
  navigate('orders');
}

function isOnline(u) {
  if (!u.online || !u.lastSeen) return false;
  return (Date.now() - new Date(u.lastSeen).getTime()) < 2 * 60 * 1000;
}

function renderAdminDrive(el) {
  el.innerHTML = `<div class="drive-card"><div class="drive-label">Ładowanie danych dysku...</div>
    <div class="drive-bar-wrap"><div class="drive-bar" style="width:0%"></div></div></div>`;

  fns.httpsCallable('getDriveStorage')({})
    .then(result => {
      const { limit, usage, folderId } = result.data;
      const usedGB  = (parseInt(usage)  / 1e9).toFixed(2);
      const totalGB = (parseInt(limit)  / 1e9).toFixed(1);
      const pct     = Math.min(100, Math.round(parseInt(usage) / parseInt(limit) * 100));
      const barCls  = pct > 85 ? 'danger' : pct > 65 ? 'warn' : '';
      const folderUrl = folderId ? `https://drive.google.com/drive/folders/${folderId}` : '#';
      el.innerHTML = `
        <div class="drive-card">
          <div class="drive-label">Google Drive — zajętość konta Roltes</div>
          <div class="drive-bar-wrap"><div class="drive-bar ${barCls}" style="width:${pct}%"></div></div>
          <div style="font-size:.75rem;color:var(--muted);margin-top:8px">
            ${usedGB} GB / ${totalGB} GB (${pct}%)
          </div>
        </div>
        <div style="background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);font-size:.85rem;line-height:1.6">
          <a href="${folderUrl}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">

          <span style="font-size:.78rem;color:var(--muted)">Każde zamówienie ma swój podfolder z plikami zdjęć.</span>
        </div>`;
    })
    .catch(e => {
      el.innerHTML = `<div class="drive-card">
        <div class="drive-label" style="color:var(--nowe)">Błąd połączenia z Drive: ${esc(e.message||'Nieznany błąd')}</div>

      </div>`;
    });
}

async function createOrder() {
  const num    = g('mo-num').value.trim();
  const client = g('mo-client').value.trim();
  if (!num || !client) { g('mo-err').textContent = 'Wypełnij numer i zamawiającego.'; return; }

  const btn = g('mo-save');
  btn.disabled = true;

async function saveOrder(id) {
  const idx = cache.orders.findIndex(o => o.id === id);
  if (idx === -1) return;
  const o   = cache.orders[idx];
  const u   = cache.me;
  const changes = [];

  if (can('editNum')) {
    const nv = g('d-num')?.value?.trim();
    if (nv && nv !== o.numerZamowienia) { changes.push('Zmiana nr zamówienia na: '+nv); o.numerZamowienia = nv; }
  }
  if (can('editDates')) {
    const dd = g('d-date')?.value;
    const dp = g('d-planned')?.value;
    if (dd && dd !== o.dataZamowienia) { changes.push('Zmiana daty zamówienia'); o.dataZamowienia = dd; }
    if (dp !== undefined && dp !== o.planowanaData) { changes.push('Zmiana planowanej daty'); o.planowanaData = dp; }
  }
  if (can('editDetails')) {
    const cl = g('d-client')?.value?.trim();
    const rt = g('d-route')?.value?.trim();
    const pr = g('d-product')?.value;
    const co = g('d-color')?.value;
    const pi = g('d-prio')?.value;
    if (cl && cl !== o.zamawiajacy)    { changes.push('Zmiana zamawiającego'); o.zamawiajacy = cl; }
    if (rt !== undefined && rt !== o.numerTrasy)  { o.numerTrasy = rt; }
    if (pr && pr !== o.rodzajProduktu) { changes.push('Zmiana produktu na: '+pr); o.rodzajProduktu = pr; }
    if (co && co !== o.kolorMaterialu) { changes.push('Zmiana koloru na: '+co); o.kolorMaterialu = co; }
    if (pi && pi !== o.priorytet)      { changes.push('Zmiana priorytetu na: '+(pi==='wazny'?'Ważny':'Normalny')); o.priorytet = pi; }
  }
  if (can('addComment')) {
    const cm = g('d-comment')?.value;
    if (cm !== undefined && cm !== o.komentarz) { changes.push('Aktualizacja komentarza'); o.komentarz = cm; }
  }

  if (changes.length) {
    o.log = [...(o.log||[]), { timestamp:nowISO(), username:u.username, displayName:u.displayName, action:changes.join('; ') }];
  }

  showLoad();
  try {
    await db.collection('orders').doc(id).set(o);
    toast('Zapisano');
    renderOrderDetail(g('main'), id);
  } catch(e) {
    toast('Błąd zapisu: ' + (e.message || e));
  } finally {
    hideLoad();
  }
}

async function uploadPhotos(orderId, input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;

  const order = cache.orders.find(o => o.id === orderId);
  if (!order) return;
  const u = cache.me;

  showLoad();
  for (const file of files) {
    try {
      const data   = await compressImg(file);
      const base64 = data.replace(/^data:[^;]+;base64,/, '');
      const mime   = data.match(/^data:([^;]+);/)?.[1] || 'image/jpeg';
      const res    = await fns.httpsCallable('uploadPhoto')({
        budowaId: orderId, numerZamowienia: order.numerZamowienia,
        fileBase64: base64, fileName: file.name, mimeType: mime,
      });
      const z = { id: res.data.id, name: res.data.name, viewLink: res.data.viewLink };
      order.zdjecia = [...(order.zdjecia||[]), z];
      order.log = [...(order.log||[]), {
        timestamp: nowISO(), username: u.username, displayName: u.displayName,
        action: 'Dodanie zdjęcia: ' + file.name,
      }];
      await db.collection('orders').doc(orderId).update({ zdjecia: order.zdjecia, log: order.log });
    } catch(e) { console.error(e); toast('Błąd uploadu: ' + file.name); }
  }
  hideLoad();
  renderOrderDetail(g('main'), orderId);
}

function deletePhoto(orderId, zid) {
  confirm2('Usuń zdjęcie', 'Zdjęcie zostanie trwale usunięte z Google Drive.', 'Usuń', async () => {
    const order = cache.orders.find(o => o.id === orderId);
    if (!order) return;
    const z = (order.zdjecia||[]).find(z=>z.id===zid);
    const u = cache.me;
    showLoad();
    try {
      if (z?.id) await fns.httpsCallable('deletePhoto')({ fileId: z.id });
      order.zdjecia = (order.zdjecia||[]).filter(z=>z.id!==zid);
      order.log = [...(order.log||[]), {
        timestamp: nowISO(), username: u.username, displayName: u.displayName,
        action: 'Usunięcie zdjęcia' + (z ? ': '+z.name : ''),
      }];
      await db.collection('orders').doc(orderId).update({ zdjecia: order.zdjecia, log: order.log });
      renderOrderDetail(g('main'), orderId);
    } catch(e) { toast('Błąd usuwania: ' + (e.message || e)); }
    finally { hideLoad(); }
  });
}

function compressImg(file, maxW=800, q=0.65) {
  return new Promise((res,rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const r = Math.min(maxW/img.width, 1);
      const c = document.createElement('canvas');
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej;
    img.src = url;
  });
}

  confirm2('Usuń wysyłkę', 'Tej operacji nie można cofnąć. Wszystkie dane i zdjęcia wysyłki zostaną trwale usunięte.', 'Usuń', async () => {
    showLoad();
    try {
      const w = cache.wysylki.find(x => x.id === id);
      if (w?.driveFolderId) {
        try { await fns.httpsCallable('deleteDriveFolder')({ folderId: w.driveFolderId }); } catch(e) {}
      }
      await db.collection('wysylki').doc(id).delete();
      cache.wysylki = cache.wysylki.filter(x => x.id !== id);
      toast('Wysyłka usunięta');
      navigate('wysylki');

      toast('Błąd usuwania: ' + (e.message || e));
    } finally {
      hideLoad();
    }
  });
}

// ═══════════════════════════════════════════════════════════
// WYSYŁKI — zdjęcia (Google Drive, ta sama Cloud Function co zamówienia)
// ═══════════════════════════════════════════════════════════
async function uploadWysPhotos(wysId, input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;

  const w = cache.wysylki.find(x => x.id === wysId);
  if (!w) return;
  const u = cache.me;

  showLoad();
  for (const file of files) {
    try {
      const data   = await compressImg(file);
      const base64 = data.replace(/^data:[^;]+;base64,/, '');
      const mime   = data.match(/^data:([^;]+);/)?.[1] || 'image/jpeg';
      const res    = await fns.httpsCallable('uploadPhoto')({
        budowaId: wysId, numerZamowienia: w.tytul1, collection: 'wysylki',
        fileBase64: base64, fileName: file.name, mimeType: mime,
      });
      const z = { id: res.data.id, name: res.data.name, viewLink: res.data.viewLink };
      w.zdjecia = [...(w.zdjecia||[]), z];
      w.log = [...(w.log||[]), {
        timestamp: nowISO(), username: u.username, displayName: u.displayName,
        action: 'Dodanie zdjęcia: ' + file.name,
      }];
      await db.collection('wysylki').doc(wysId).update({ zdjecia: w.zdjecia, log: w.log });
    } catch(e) { console.error(e); toast('Błąd uploadu: ' + file.name); }
  }
  hideLoad();
  renderWysylkaDetail(g('main'), wysId);
}

function deleteWysPhoto(wysId, zid) {
  confirm2('Usuń zdjęcie', 'Zdjęcie zostanie trwale usunięte z Google Drive.', 'Usuń', async () => {
    const w = cache.wysylki.find(x => x.id === wysId);
    if (!w) return;
    const z = (w.zdjecia||[]).find(z=>z.id===zid);
    const u = cache.me;
    showLoad();
    try {
      if (z?.id) await fns.httpsCallable('deletePhoto')({ fileId: z.id });
      w.zdjecia = (w.zdjecia||[]).filter(z=>z.id!==zid);
      w.log = [...(w.log||[]), {
        timestamp: nowISO(), username: u.username, displayName: u.displayName,
        action: 'Usunięcie zdjęcia' + (z ? ': '+z.name : ''),
      }];
      await db.collection('wysylki').doc(wysId).update({ zdjecia: w.zdjecia, log: w.log });
      renderWysylkaDetail(g('main'), wysId);
    } catch(e) { toast('Błąd usuwania: ' + (e.message || e)); }
    finally { hideLoad(); }
  });
}

function checkPassword(pass) {
  if (pass.length < 10)              return 'Hasło musi mieć co najmniej 10 znaków.';
  if (!/[A-Z]/.test(pass))           return 'Hasło musi zawierać co najmniej jedną wielką literę.';
  if (!/[0-9]/.test(pass))           return 'Hasło musi zawierać co najmniej jedną cyfrę.';
  if (!/[^A-Za-z0-9]/.test(pass))   return 'Hasło musi zawierać co najmniej jeden znak specjalny (!@#$%...).';
  return null;
}

function validatePassInput() {
  const pass = g('mu-pass').value;
  const hint = g('mu-pass-hint');
  if (!pass) {
    hint.style.color = 'var(--muted)';
    hint.textContent = 'Wymagane: min. 10 znaków, wielka litera, cyfra, znak specjalny (!@#$%…)';
    return;
  }
  const err = checkPassword(pass);
  if (err) {
    hint.style.color = 'var(--nowe)';
    hint.textContent = '✗ ' + err;
  } else {
    hint.style.color = 'var(--gotowe,#16a34a)';
    hint.textContent = '✓ Hasło spełnia wymagania';
  }
}

function openEditUser(uid) {
  const u = cache.users.find(u=>u.id===uid);
  if (!u) return;
  editingUserId = uid;
  g('mu-title').textContent = 'Edytuj użytkownika';
  g('mu-name').value   = u.displayName;
  g('mu-uname').value  = u.username || u.email?.split('@')[0] || '';
  g('mu-role').value   = u.role;
  g('mu-active').value = u.active!==false?'true':'false';
  g('mu-pass').value   = '';

async function saveUser() {
  const name  = g('mu-name').value.trim();
  const uname = g('mu-uname').value.trim().toLowerCase();
  const pass  = g('mu-pass').value;
  const role  = g('mu-role').value;
  const err   = g('mu-err');
  const btn   = g('mu-save');

  if (!name) { err.textContent='Podaj imię i nazwisko.'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    if (editingUserId) {
      const active = g('mu-active').value === 'true';
      const payload = { uid: editingUserId, displayName: name, role, active };
      if (pass.length > 0) {
        const passErr = checkPassword(pass);
        if (passErr) { err.textContent = passErr; btn.disabled=false; btn.textContent='Zapisz'; return; }
        payload.password = pass;
      }
      await fns.httpsCallable('updateUser')(payload);
      const idx = cache.users.findIndex(u=>u.id===editingUserId);
      if (idx >= 0) Object.assign(cache.users[idx], { displayName: name, role, active });
      closeModal('modal-user');
      toast('Użytkownik zaktualizowany');
      renderAdmin(g('main'), 'users');
    } else {
      if (!uname) { err.textContent='Podaj login.'; btn.disabled=false; btn.textContent='Utwórz'; return; }
      const passErr = checkPassword(pass);
      if (passErr) { err.textContent=passErr; btn.disabled=false; btn.textContent='Utwórz'; return; }
      if (cache.users.find(u=>(u.username||u.email?.split('@')[0])===uname)) {
        err.textContent='Login już istnieje.'; btn.disabled=false; btn.textContent='Utwórz'; return;
      }
      const res = await fns.httpsCallable('createUser')({
        email: uname + '@roltes.app',
        username: uname,
        password: pass,
        displayName: name,
        role,
      });
      cache.users.push({ id: res.data.uid, username: uname, displayName: name, role, active: true });
      closeModal('modal-user');
      toast('Użytkownik utworzony');
      renderAdmin(g('main'), 'users');
    }
  } catch(e) {
    err.textContent = 'Błąd: ' + (e.message || JSON.stringify(e));
    btn.disabled = false;
    btn.textContent = editingUserId ? 'Zapisz' : 'Utwórz';
  }
}

function doDeleteUser(uid) {
  const u = cache.users.find(x => x.id === uid);
  const displayName = u?.displayName || u?.username || uid;
  confirm2('Usuń użytkownika', `Konto "${displayName}" zostanie trwale usunięte z systemu. Tej operacji nie można cofnąć.`, 'Usuń', async () => {
    try {
      await fns.httpsCallable('deleteUser')({ uid });
      cache.users = cache.users.filter(u => u.id !== uid);
      toast('Użytkownik usunięty');
      renderAdmin(g('main'), 'users');
    } catch(e) {
      toast('Błąd: ' + (e.message || JSON.stringify(e)));
    }
  });
}

// ═══════════════════════════════════════════════════════════
// IMAGE VIEWER
// ═══════════════════════════════════════════════════════════
function openImg(src) { g('img-full').src=src; resetImgZoom(); g('img-fs').classList.remove('hidden'); }
function closeImg()   { g('img-fs').classList.add('hidden'); g('img-full').src=''; resetImgZoom(); }

// ═══════════════════════════════════════════════════════════
// Pinch-to-zoom / pan dla podglądu zdjęcia (działa dla wszystkich
// kafelków, obecnych i przyszłych — każdy używa openImg()).
// ═══════════════════════════════════════════════════════════
const imgZoom = { scale:1, x:0, y:0, pointers:{}, panning:false, moved:false, startDist:0, startScale:1, startX:0, startY:0, lastTap:0 };
const IMG_ZOOM_MIN = 1, IMG_ZOOM_MAX = 5;

function resetImgZoom() {
  imgZoom.scale=1; imgZoom.x=0; imgZoom.y=0; imgZoom.pointers={};
  imgZoom.panning=false; imgZoom.moved=false; imgZoom.lastTap=0;
  const img = g('img-full');
  img.classList.remove('zooming');
  g('img-fs').classList.remove('zoomed','dragging');
  applyImgTransform();
}

function applyImgTransform() {
  g('img-full').style.transform = `translate(${imgZoom.x}px, ${imgZoom.y}px) scale(${imgZoom.scale})`;
  g('img-fs').classList.toggle('zoomed', imgZoom.scale > 1.01);
}

function imgPointDist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }
function imgClamp(v,min,max) { return Math.min(max, Math.max(min, v)); }

function clampImgPan() {
  const img = g('img-full');
  const rect = img.getBoundingClientRect();
  const fsRect = g('img-fs').getBoundingClientRect();
  // ile obrazu (w px, przy aktualnej skali) wystaje poza kontener
  const overflowX = Math.max(0, (rect.width  - fsRect.width)  / 2);
  const overflowY = Math.max(0, (rect.height - fsRect.height) / 2);
  imgZoom.x = imgClamp(imgZoom.x, -overflowX, overflowX);
  imgZoom.y = imgClamp(imgZoom.y, -overflowY, overflowY);
}

function toggleImgZoomAt(clientX, clientY) {
  const img = g('img-full');
  img.classList.remove('zooming');
  if (imgZoom.scale > 1.01) {
    imgZoom.scale = 1; imgZoom.x = 0; imgZoom.y = 0;
  } else {
    const rect = img.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    imgZoom.scale = 2.5;
    imgZoom.x = (cx - clientX) * (imgZoom.scale - 1);
    imgZoom.y = (cy - clientY) * (imgZoom.scale - 1);
    clampImgPan();
  }
  applyImgTransform();
}

function imgFsPointerDown(e) {
  if (e.target.closest('.img-fs-close')) return;
  const fs = g('img-fs');
  fs.setPointerCapture(e.pointerId);
  imgZoom.pointers[e.pointerId] = { x:e.clientX, y:e.clientY };
  const pts = Object.values(imgZoom.pointers);
  imgZoom.moved = false;
  g('img-full').classList.add('zooming');

  if (pts.length === 1) {
    imgZoom.panning = true;
    imgZoom.startX = e.clientX - imgZoom.x;
    imgZoom.startY = e.clientY - imgZoom.y;
    const now = Date.now();
    if (now - imgZoom.lastTap < 300) {
      imgZoom.lastTap = 0;
      imgZoom.panning = false;
      toggleImgZoomAt(e.clientX, e.clientY);
    } else {
      imgZoom.lastTap = now;
    }
  } else if (pts.length === 2) {
    imgZoom.panning = false;
    imgZoom.startDist = imgPointDist(pts[0], pts[1]);
    imgZoom.startScale = imgZoom.scale;
  }
}

function imgFsPointerMove(e) {
  if (!imgZoom.pointers[e.pointerId]) return;
  imgZoom.pointers[e.pointerId] = { x:e.clientX, y:e.clientY };
  const pts = Object.values(imgZoom.pointers);

  if (pts.length === 1 && imgZoom.panning) {
    imgZoom.x = e.clientX - imgZoom.startX;
    imgZoom.y = e.clientY - imgZoom.startY;
    imgZoom.moved = true;
    g('img-fs').classList.add('dragging');
    applyImgTransform();
  } else if (pts.length === 2) {
    const d = imgPointDist(pts[0], pts[1]);
    if (imgZoom.startDist > 0) {
      imgZoom.scale = imgClamp(imgZoom.startScale * (d / imgZoom.startDist), IMG_ZOOM_MIN, IMG_ZOOM_MAX);
      imgZoom.moved = true;
      applyImgTransform();
    }
  }
}

function imgFsPointerUp(e) {
  delete imgZoom.pointers[e.pointerId];
  const pts = Object.values(imgZoom.pointers);
  const wasTap = !imgZoom.moved;
  const tappedBackdrop = e.target.id === 'img-fs';

  if (pts.length === 1) {
    // jeden palec został po zdjęciu drugiego przy pinchu — kontynuuj jako przesuwanie
    imgZoom.panning = true;
    imgZoom.startX = pts[0].x - imgZoom.x;
    imgZoom.startY = pts[0].y - imgZoom.y;
  } else if (pts.length === 0) {
    imgZoom.panning = false;
    g('img-fs').classList.remove('dragging');
    g('img-full').classList.remove('zooming');
    if (imgZoom.scale <= 1.01) {
      imgZoom.scale = 1; imgZoom.x = 0; imgZoom.y = 0;
      applyImgTransform();
    } else {
      clampImgPan();
      applyImgTransform();
    }
    if (wasTap && imgZoom.scale <= 1.01 && tappedBackdrop) closeImg();
  }
}

(function initImgFsGestures(){
  const fs = g('img-fs');
  fs.addEventListener('pointerdown', imgFsPointerDown);
  fs.addEventListener('pointermove', imgFsPointerMove);
  fs.addEventListener('pointerup',   imgFsPointerUp);
  fs.addEventListener('pointercancel', imgFsPointerUp);
})();

// UTILS
// ═══════════════════════════════════════════════════════════
function g(id) { return document.getElementById(id); }
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nowISO() { return new Date().toISOString(); }
function fmtDate(s)     { if(!s) return '—'; try { return new Date(s+'T00:00:00').toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'}); } catch { return s; } }
function fmtDateTime(s) { if(!s) return '—'; try { return new Date(s).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch { return s; } }

let toastTmr;
function toast(msg, dur=2600) {
  const el=g('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTmr); toastTmr=setTimeout(()=>el.classList.remove('show'),dur);
}
function showLoad(){ g('loading').classList.remove('hidden'); }
function hideLoad(){ g('loading').classList.add('hidden'); }

// ═══════════════════════════════════════════════════════════
// INIT — Firebase auth state drives everything
// ═══════════════════════════════════════════════════════════
auth.onAuthStateChanged(async fbUser => {
  if (!fbUser) {
    cache.me = null;
    hideLoad();
    navigate('login');
    return;
  }
  try {
    const snap = await db.collection('users').doc(fbUser.uid).get();
    if (!snap.exists || snap.data().active === false) {
      await auth.signOut();
      return;
    }
    const ud = snap.data();
    cache.me = {
      uid:         fbUser.uid,
      username:    ud.username || ud.email?.split('@')[0] || '',
      displayName: ud.displayName || fbUser.displayName || '',
      role:        ud.role,
    };
    await loadAllData();
    presenceStart();
    showApp();
  } catch(e) {
    console.error('Init error:', e);
    hideLoad();
    navigate('login');
  }
});
